# CI: verify the site typechecks and builds on every push and PR.
#
# NOTE: the previous workflow here tried to deploy to GitHub Pages by
# uploading ./out — but the app is built with `output: 'standalone'` (a Node
# server build) and uses API routes, so a static GitHub Pages deploy can never
# work and the workflow failed on every push. The site is hosted on its own
# server at wlcreationx.co.za; CI's job is to prove the build is green before
# that deploy happens.
name: CI — build check

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

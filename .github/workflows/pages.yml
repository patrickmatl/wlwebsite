# DISABLED — this workflow used to deploy to GitHub Pages via `next export`,
# a command removed in Next.js 14+, so it failed on every push. It also raced
# nextjs.yml in the same "pages" concurrency group. The site cannot be hosted
# on GitHub Pages at all (it is a Node server build with API routes).
# Kept as a manually-triggerable no-op so the file's history is preserved;
# safe to delete.
name: Deploy to GitHub Pages (disabled)

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: echo "GitHub Pages deploy is disabled — see .github/workflows/nextjs.yml (CI build check). The site deploys to its own server."
